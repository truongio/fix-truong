<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fix Truong</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      /* Base Palette - Mobile */
      --bg: #FAFAFA;
      --text: #0A0A0A;
      --text-dim: #525252;
      --text-muted: #A3A3A3;
      --accent: #0A0A0A;
      --accent-warm: #C2410C;
      --accent-orange: #C2410C;
      --success: #059669;
      --sidebar-bg: #F5F5F5;
      --illustration-bg: #F0F0F0;

      /* Typography Scale */
      --text-hero: clamp(4rem, 12vw, 14rem);
      --text-display: clamp(2.5rem, 8vw, 8rem);
      --text-stat: clamp(3rem, 10vw, 10rem);
      --text-body: clamp(1rem, 1.5vw, 1.5rem);
      --text-label: clamp(0.7rem, 1vw, 0.9rem);

      /* Spacing */
      --space-xs: 8px;
      --space-sm: 16px;
      --space-md: 24px;
      --space-lg: 40px;
      --space-xl: 60px;
      --space-2xl: 80px;

      /* Easing */
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out-expo: cubic-bezier(0.87, 0, 0.13, 1);

      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* ... (keep mobile styles mostly as is, but update colors via variables) ... */

    /* Global Scrollbar Hiding */
    * {
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* IE/Edge */
    }

    *::-webkit-scrollbar {
      display: none;
      /* Chrome/Safari/Opera */
    }

    /* ... (existing mobile styles) ... */

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 500px;
      margin: 0 auto;
      transition: all 0.3s ease;
    }

    /* Start Screen */
    .start-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 40px 24px;
      text-align: left;
    }

    .start-screen .start-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 80px;
    }

    .start-screen h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .start-screen .subtitle {
      color: var(--text-dim);
      font-size: 1rem;
      margin-bottom: 48px;
    }

    .start-btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 16px 48px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .start-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    /* Exercise Screen */
    .exercise-screen {
      flex: 1;
      display: none;
      flex-direction: column;
    }

    .exercise-screen.active {
      display: flex;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 8px;
      margin: -8px;
      opacity: 0.8;
    }

    .back-btn:disabled {
      opacity: 0.3;
    }

    .header-title {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--text-dim);
      display: none; /* Hidden on mobile, sound toggle takes this spot */
    }

    .header-timer {
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 24px 24px;
    }

    /* Exercise Info */
    .exercise-info {
      margin-bottom: 24px;
    }

    .exercise-name {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 16px;
      line-height: 1.1;
    }

    /* Progress Dots */
    .progress-dots {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }

    .dot {
      width: 24px;
      height: 6px;
      border-radius: 3px;
      background: var(--text-dim);
      opacity: 0.3;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: var(--accent);
      opacity: 1;
    }

    .dot.completed {
      background: var(--text-dim);
      opacity: 0.6;
    }

    /* Stats Display */
    .stats {
      display: flex;
      gap: 48px;
      margin-bottom: 40px;
    }

    .stat {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }

    .stat-value.yellow {
      color: var(--accent);
    }

    .stat-value.orange {
      color: var(--accent-orange);
    }

    .stat-value.small {
      font-size: 2rem;
    }

    /* Side Indicator */
    .side-label {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    /* Exercise Illustration */
    .illustration {
      width: 168px;
      height: 168px;
      margin-bottom: 24px;
      opacity: 1;
      --sketch-ink: #46515A;
      --sketch-mid: #7B8992;
      --sketch-light: #B7C1C6;
      --sketch-wash: #E9EEF0;
      --sketch-shade: #DCE5E8;
    }

    .illustration svg {
      width: 100%;
      height: 100%;
    }

    .illustration line,
    .illustration circle,
    .illustration path,
    .illustration ellipse,
    .illustration polyline,
    .illustration polygon {
      stroke: var(--sketch-ink);
      stroke-width: 0.92;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .illustration .sketch-wash {
      fill: var(--sketch-wash);
      stroke: none;
      opacity: 0.72;
    }

    .illustration .sketch-shade {
      fill: var(--sketch-shade);
      stroke: none;
      opacity: 0.72;
    }

    .illustration .sketch-mid {
      stroke: var(--sketch-mid);
      stroke-width: 0.8;
    }

    .illustration .sketch-light {
      stroke: var(--sketch-light);
      stroke-width: 0.65;
    }

    .illustration .sketch-hatch {
      stroke: var(--sketch-mid);
      stroke-width: 0.46;
      opacity: 0.58;
    }

    .illustration .sketch-detail {
      stroke: var(--sketch-ink);
      stroke-width: 0.48;
      opacity: 0.82;
    }

    .illustration .sketch-echo {
      stroke: var(--sketch-light);
      stroke-width: 0.42;
      opacity: 0.82;
    }

    .illustration .motion-guide {
      stroke: var(--sketch-light);
      stroke-width: 0.62;
      stroke-dasharray: 1 3;
      opacity: 0.62;
    }

    .illustration .sketch-breathe {
      animation: sketch-breathe 3.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .illustration .motion-chin-tuck {
      animation: sketch-chin-tuck 3.2s var(--ease-in-out-expo) infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .illustration .motion-neck-circle {
      animation: sketch-neck-circle 5.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 85%;
    }

    .illustration .motion-side-bend {
      animation: sketch-side-bend 4s var(--ease-in-out-expo) infinite;
      transform-box: fill-box;
      transform-origin: 50% 90%;
    }

    .illustration .motion-levator {
      animation: sketch-levator 4s var(--ease-in-out-expo) infinite;
      transform-box: fill-box;
      transform-origin: 45% 90%;
    }

    .illustration .motion-pec {
      animation: sketch-pec 4s var(--ease-in-out-expo) infinite;
      transform-box: fill-box;
      transform-origin: left bottom;
    }

    .illustration .motion-nod {
      animation: sketch-nod 3.4s var(--ease-in-out-expo) infinite;
      transform-box: fill-box;
      transform-origin: right bottom;
    }

    .illustration .motion-angel-left,
    .illustration .motion-angel-right {
      transform-box: fill-box;
    }

    .illustration .motion-angel-left {
      animation: sketch-angel-left 4.2s var(--ease-in-out-expo) infinite;
      transform-origin: right bottom;
    }

    .illustration .motion-angel-right {
      animation: sketch-angel-right 4.2s var(--ease-in-out-expo) infinite;
      transform-origin: left bottom;
    }

    @keyframes sketch-breathe {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.012); }
    }

    @keyframes sketch-chin-tuck {
      0%, 18%, 100% { transform: translateX(0); }
      42%, 72% { transform: translateX(-5px); }
    }

    @keyframes sketch-neck-circle {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      22% { transform: translate(-3px, 4px) rotate(-9deg); }
      48% { transform: translate(0, 7px) rotate(0deg); }
      74% { transform: translate(3px, 4px) rotate(9deg); }
    }

    @keyframes sketch-side-bend {
      0%, 18%, 100% { transform: rotate(0deg); }
      45%, 75% { transform: rotate(12deg); }
    }

    @keyframes sketch-levator {
      0%, 18%, 100% { transform: rotate(0deg) translate(0, 0); }
      45%, 75% { transform: rotate(13deg) translate(-2px, 3px); }
    }

    @keyframes sketch-pec {
      0%, 18%, 100% { transform: translateX(0) rotate(0deg); }
      45%, 75% { transform: translateX(-5px) rotate(-2deg); }
    }

    @keyframes sketch-nod {
      0%, 18%, 100% { transform: translateY(0) rotate(0deg); }
      45%, 72% { transform: translateY(-4px) rotate(-5deg); }
    }

    @keyframes sketch-angel-left {
      0%, 18%, 100% { transform: rotate(0deg) translateY(0); }
      48%, 72% { transform: rotate(-22deg) translateY(-9px); }
    }

    @keyframes sketch-angel-right {
      0%, 18%, 100% { transform: rotate(0deg) translateY(0); }
      48%, 72% { transform: rotate(22deg) translateY(-9px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .illustration [class*="motion-"],
      .illustration .sketch-breathe {
        animation: none !important;
      }
    }

    @keyframes breathe {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-3px);
      }
    }

    @keyframes nod {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(6px);
      }
    }

    @keyframes tilt {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(15deg);
      }
    }

    @keyframes raise {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-8px) rotate(-5deg);
      }
    }

    @keyframes tuck {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(-8px);
      }
    }

    @keyframes circle {
      0% {
        transform: rotate(0deg) translateX(0) translateY(0);
      }

      25% {
        transform: rotate(90deg) translateX(0) translateY(-10px);
      }

      50% {
        transform: rotate(180deg) translateX(0) translateY(0);
      }

      75% {
        transform: rotate(270deg) translateX(0) translateY(10px);
      }

      100% {
        transform: rotate(360deg) translateX(0) translateY(0);
      }
    }

    @keyframes slide-up {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes slide-down {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(15px);
      }
    }

    @keyframes rotate-arms-up {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(-45deg);
      }
    }

    @keyframes rotate-arms-down {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(45deg);
      }
    }

    @keyframes lift-head {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-5px) rotate(-8deg);
      }
    }

    @keyframes step-forward {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(8px);
      }
    }

    @keyframes thread-arm {

      0%,
      100% {
        transform: translateX(0) translateY(0);
      }

      50% {
        transform: translateX(-15px) translateY(10px);
      }
    }

    @keyframes y-position {

      0%,
      100% {
        transform: rotate(0deg) translateY(0);
      }

      50% {
        transform: rotate(-30deg) translateY(-20px);
      }
    }

    @keyframes t-position {

      0%,
      100% {
        transform: rotate(0deg) translateY(0);
      }

      50% {
        transform: rotate(0deg) translateY(-15px);
      }
    }

    @keyframes w-position {

      0%,
      100% {
        transform: rotate(0deg) translateY(0);
      }

      50% {
        transform: rotate(15deg) translateY(-10px);
      }
    }

    .anim-breathe {
      animation: breathe 3s ease-in-out infinite;
    }

    .anim-pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.8;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .anim-nod {
      animation: nod 2s ease-in-out infinite;
    }

    .anim-tilt {
      animation: tilt 3s ease-in-out infinite;
    }

    .anim-raise {
      animation: raise 2.5s ease-in-out infinite;
    }

    .anim-tuck {
      animation: tuck 2s ease-in-out infinite;
    }

    .anim-circle {
      animation: circle 4s ease-in-out infinite;
    }

    .anim-slide-up {
      animation: slide-up 3s ease-in-out infinite;
    }

    .anim-slide-down {
      animation: slide-down 3s ease-in-out infinite;
    }

    .anim-rotate-arms-up {
      animation: rotate-arms-up 3s ease-in-out infinite;
    }

    .anim-rotate-arms-down {
      animation: rotate-arms-down 3s ease-in-out infinite;
    }

    .anim-lift-head {
      animation: lift-head 2s ease-in-out infinite;
    }

    .anim-step-forward {
      animation: step-forward 2s ease-in-out infinite;
    }

    .anim-thread-arm {
      animation: thread-arm 3s ease-in-out infinite;
    }

    .anim-y-position {
      animation: y-position 2s ease-in-out infinite;
    }

    .anim-t-position {
      animation: t-position 2s ease-in-out infinite;
    }

    .anim-w-position {
      animation: w-position 2s ease-in-out infinite;
    }

    /* Instructions */
    .instructions {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 32px;
      max-height: 80px;
      overflow: hidden;
    }

    /* Bottom Controls */
    .bottom-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .nav-btn:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.95);
    }

    .nav-btn:disabled {
      opacity: 0.3;
    }

    .done-btn {
      background: rgba(74, 222, 128, 0.15);
      border: none;
      color: var(--success);
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .done-btn:active {
      background: rgba(74, 222, 128, 0.25);
      transform: scale(0.96);
    }

    .done-btn .checkmark {
      font-size: 1.1rem;
    }

    /* Completion Screen */
    .completion-screen {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      text-align: center;
    }

    .completion-screen.active {
      display: flex;
    }

    .completion-icon {
      font-size: 4rem;
      margin-bottom: 24px;
    }

    .completion-screen h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .completion-screen p {
      color: var(--text-dim);
      margin-bottom: 48px;
    }

    .completion-stats {
      display: flex;
      gap: 32px;
      margin-bottom: 48px;
    }

    .completion-stat {
      text-align: center;
    }

    .completion-stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .completion-stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .restart-btn {
      background: transparent;
      border: 1px solid var(--text-dim);
      color: var(--text);
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .restart-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Sound Toggle */
    .sound-toggle {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: none;
      border: none;
      font-size: 1.25rem;
      color: var(--text-dim);
      cursor: pointer;
      z-index: 100;
      padding: 8px;
      transition: all 0.2s;
    }

    .sound-toggle:active {
      opacity: 0.6;
    }

    /* Desktop Sidebar - Hidden on Mobile */
    .desktop-sidebar {
      display: none;
    }

    /* Footer - Hidden on Mobile */
    .exercise-footer {
      display: none;
    }

    /* Hidden */
    .hidden {
      display: none !important;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideOut {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(-100%);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(100%);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.3s ease;
    }

    .slide-out {
      animation: slideOut 0.3s ease forwards;
    }

    .slide-in {
      animation: slideIn 0.3s ease forwards;
    }

    /* ═══════════════════════════════════════════════════════════════
       PREMIUM DESKTOP DESIGN - Editorial & Minimal
       ═══════════════════════════════════════════════════════════════ */
    @media (min-width: 1024px) {
      :root {
        --bg: #FAFAFA;
        --text: #0A0A0A;
        --text-dim: #525252;
        --text-muted: #A3A3A3;
        --accent: #0A0A0A;
        --accent-warm: #C2410C;
        --success: #059669;
        --sidebar-bg: #F5F5F5;
        --illustration-bg: #E5E5E5;
      }

      body {
        background: var(--bg);
        color: var(--text);
      }

      .app {
        max-width: 100%;
        width: 100vw;
        height: 100vh;
        margin: 0;
        border-radius: 0;
        background: var(--bg);
        overflow: hidden;
        position: relative;
      }

      /* ═══════════════════════════════════════════════════════════════
         START SCREEN - Full Viewport Hero
         ═══════════════════════════════════════════════════════════════ */
      .start-screen {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--space-2xl);
        background: var(--bg);
        position: relative;
        overflow: hidden;
      }

      /* Abstract background shape */
      .start-screen::before {
        content: '';
        position: absolute;
        right: -20%;
        top: 50%;
        transform: translateY(-50%);
        width: 70vw;
        height: 70vw;
        background: radial-gradient(circle, var(--illustration-bg) 0%, transparent 70%);
        opacity: 0.6;
        pointer-events: none;
      }

      .start-screen .start-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 0;
      }

      .start-screen h1 {
        font-family: var(--font-sans);
        font-size: var(--text-hero);
        line-height: 0.9;
        margin-bottom: var(--space-lg);
        color: var(--text);
        letter-spacing: -0.04em;
        text-align: center;
        font-weight: 800;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
      }

      .start-screen .subtitle {
        font-family: var(--font-sans);
        font-size: 1.1rem;
        margin-bottom: var(--space-2xl);
        font-weight: 400;
        color: var(--text-muted);
        text-align: center;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
      }

      .start-btn {
        font-family: var(--font-sans);
        font-size: 1rem;
        padding: 24px 64px;
        background: var(--text);
        color: var(--bg);
        border: 2px solid var(--text);
        border-radius: 0;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 500;
        cursor: pointer;
        position: relative;
        z-index: 1;
        overflow: hidden;
        transition: all 0.5s var(--ease-out-expo);
      }

      .start-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--bg);
        transform: translateY(100%);
        transition: transform 0.5s var(--ease-out-expo);
      }

      .start-btn span {
        position: relative;
        z-index: 1;
      }

      .start-btn:hover {
        color: var(--text);
        transform: translateY(-4px);
      }

      .start-btn:hover::before {
        transform: translateY(0);
      }

      /* ═══════════════════════════════════════════════════════════════
         EXERCISE SCREEN - Asymmetric Magazine Layout
         ═══════════════════════════════════════════════════════════════ */
      .exercise-screen {
        width: 100%;
        height: 100%;
        background: var(--bg);
      }

      .exercise-screen.active {
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 55% 45%;
      }

      /* Header */
      .header {
        grid-column: 1 / -1;
        grid-row: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--space-lg) var(--space-xl);
        background: transparent;
        border-bottom: none;
      }

      .back-btn {
        display: none;
      }

      .header-title {
        display: block; /* Show on desktop */
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .header-timer {
        font-size: 1rem;
        font-weight: 500;
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
        margin-right: 100px; /* Space for sound toggle */
      }

      /* Desktop Sidebar - Hidden by default, appears on hover */
      .desktop-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 320px;
        background: var(--bg);
        border-right: 1px solid var(--illustration-bg);
        padding: 100px var(--space-lg);
        transform: translateX(-290px);
        transition: transform 0.5s var(--ease-out-expo);
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
      }

      .desktop-sidebar:hover {
        transform: translateX(0);
      }

      /* Sidebar visual indicator when collapsed */
      .desktop-sidebar::after {
        content: '';
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 60px;
        background: var(--illustration-bg);
        border-radius: 2px;
        transition: background 0.3s ease;
      }

      .desktop-sidebar:hover::after {
        background: transparent;
      }

      .sidebar-item {
        padding: 16px 24px;
        color: var(--text-muted);
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s var(--ease-out-expo);
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .sidebar-item:hover {
        background: var(--illustration-bg);
        color: var(--text);
      }

      .sidebar-item.active {
        color: var(--text);
        background: var(--illustration-bg);
        font-weight: 600;
      }

      .sidebar-item.completed {
        color: var(--success);
      }

      /* Main Content */
      .main-content {
        grid-column: 1 / -1;
        grid-row: 2;
        display: grid;
        grid-template-columns: 55% 45%;
        padding: 0;
        overflow: hidden;
        height: 100%;
      }

      .exercise-info {
        display: contents;
        margin: 0;
      }

      /* Content wrapper for right side - vertical centering */
      .content-wrapper {
        grid-column: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: var(--space-xl);
      }

      /* Illustration Area (Left) */
      .illustration {
        grid-column: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-xl);
        position: relative;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 1;
      }

      .illustration::before {
        display: none;
      }

      .illustration svg {
        width: 100%;
        height: 100%;
        max-width: 500px;
        max-height: 500px;
        position: relative;
        z-index: 1;
      }

      .illustration line,
      .illustration circle,
      .illustration path,
      .illustration ellipse {
        stroke: var(--sketch-ink);
      }

      /* Content Area (Right) */
      .side-label {
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent-warm);
        margin: 0;
        margin-bottom: var(--space-sm);
      }

      .exercise-name {
        font-family: var(--font-sans);
        font-size: clamp(2.5rem, 5vw, 5rem);
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.02em;
        color: var(--text);
        margin: 0;
        margin-bottom: var(--space-md);
        text-transform: uppercase;
      }

      .progress-dots {
        display: none;
      }

      .stats {
        display: flex;
        gap: var(--space-xl);
        margin: 0;
        margin-bottom: var(--space-md);
      }

      .stat {
        display: flex;
        flex-direction: column;
      }

      .stat-label {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: var(--space-xs);
      }

      .stat-value {
        font-family: var(--font-sans);
        font-size: clamp(3rem, 6vw, 6rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      .stat-value.yellow {
        color: var(--text);
      }

      .stat-value.orange {
        color: var(--accent-warm);
      }

      .stat-value.small {
        font-size: calc(var(--text-stat) * 0.6);
      }

      .instructions {
        font-size: 1.1rem;
        line-height: 1.5;
        color: var(--text-dim);
        font-weight: 400;
        max-height: none;
        margin: 0;
        margin-bottom: var(--space-lg);
        max-width: 480px;
      }

      .bottom-controls {
        display: flex;
        gap: var(--space-md);
      }

      .nav-btn {
        width: 64px;
        height: 64px;
        font-size: 1.5rem;
        background: transparent;
        border: 2px solid var(--illustration-bg);
        color: var(--text-dim);
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.4s var(--ease-out-expo);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-btn:hover:not(:disabled) {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
        transform: scale(1.05);
      }

      .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .done-btn {
        padding: 0 48px;
        height: 64px;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: var(--text);
        color: var(--bg);
        border: 2px solid var(--text);
        border-radius: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        overflow: hidden;
        transition: all 0.5s var(--ease-out-expo);
      }

      .done-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--success);
        transform: translateX(-100%);
        transition: transform 0.5s var(--ease-out-expo);
      }

      .done-btn span,
      .done-btn .checkmark {
        position: relative;
        z-index: 1;
      }

      .done-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }

      .done-btn:hover::before {
        transform: translateX(0);
      }

      .done-btn:active {
        transform: translateY(-2px) scale(0.98);
      }

      /* Footer with Progress Bar */
      .exercise-footer {
        grid-column: 1 / -1;
        grid-row: 3;
        padding: var(--space-md) var(--space-xl);
        display: flex !important;
        align-items: center;
        gap: var(--space-lg);
        border-top: 1px solid var(--illustration-bg);
      }

      .progress-track {
        flex: 1;
        height: 3px;
        background: var(--illustration-bg);
        border-radius: 2px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--text);
        border-radius: 2px;
        transition: width 0.5s var(--ease-out-expo);
      }

      .progress-text {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        white-space: nowrap;
      }

      /* ═══════════════════════════════════════════════════════════════
         COMPLETION SCREEN
         ═══════════════════════════════════════════════════════════════ */
      .completion-screen {
        width: 100%;
        height: 100%;
        padding: var(--space-2xl);
        background: var(--bg);
        position: relative;
        overflow: hidden;
      }

      .completion-screen::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 80vw;
        height: 80vw;
        background: radial-gradient(circle, var(--illustration-bg) 0%, transparent 60%);
        opacity: 0.5;
        pointer-events: none;
      }

      .completion-icon {
        font-size: 6rem;
        margin-bottom: var(--space-lg);
        color: var(--success);
        position: relative;
        z-index: 1;
      }

      .completion-screen h2 {
        font-family: var(--font-sans);
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        margin-bottom: var(--space-md);
        color: var(--text);
        position: relative;
        z-index: 1;
      }

      .completion-screen p {
        font-size: 1.25rem;
        color: var(--text-dim);
        margin-bottom: var(--space-2xl);
        position: relative;
        z-index: 1;
      }

      .completion-stats {
        display: flex;
        gap: var(--space-2xl);
        margin-bottom: var(--space-2xl);
        position: relative;
        z-index: 1;
      }

      .completion-stat {
        text-align: center;
      }

      .completion-stat-value {
        font-family: var(--font-sans);
        font-size: clamp(2.5rem, 6vw, 4rem);
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .completion-stat-label {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: var(--space-xs);
      }

      .restart-btn {
        padding: 20px 56px;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        background: transparent;
        color: var(--text);
        border: 2px solid var(--text);
        border-radius: 0;
        cursor: pointer;
        position: relative;
        z-index: 1;
        overflow: hidden;
        transition: all 0.5s var(--ease-out-expo);
      }

      .restart-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--text);
        transform: translateY(100%);
        transition: transform 0.5s var(--ease-out-expo);
      }

      .restart-btn span {
        position: relative;
        z-index: 1;
      }

      .restart-btn:hover {
        color: var(--bg);
        transform: translateY(-4px);
      }

      .restart-btn:hover::before {
        transform: translateY(0);
      }

      /* ═══════════════════════════════════════════════════════════════
         SOUND TOGGLE
         ═══════════════════════════════════════════════════════════════ */
      .sound-toggle {
        position: fixed;
        top: 44px;
        left: auto;
        right: var(--space-xl);
        transform: none;
        padding: 0;
        background: transparent;
        border: none;
        font-size: 1.25rem;
        color: var(--text-muted);
        cursor: pointer;
        transition: color 0.3s var(--ease-out-expo);
        z-index: 50;
      }

      .sound-toggle:hover {
        color: var(--text);
        background: transparent;
        transform: none;
      }

      /* ═══════════════════════════════════════════════════════════════
         ANIMATIONS
         ═══════════════════════════════════════════════════════════════ */
      @keyframes slideInFromRight {
        from {
          opacity: 0;
          transform: translateX(60px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideOutToLeft {
        from {
          opacity: 1;
          transform: translateX(0);
        }
        to {
          opacity: 0;
          transform: translateX(-60px);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes countdownPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      /* Staggered entry animations */
      .slide-in .illustration { animation: fadeInUp 0.6s var(--ease-out-expo) 0s both; }
      .slide-in .content-wrapper { animation: fadeInUp 0.6s var(--ease-out-expo) 0.1s both; }

      .slide-out {
        animation: slideOutToLeft 0.5s var(--ease-out-expo) forwards;
      }

      .countdown-warning {
        animation: countdownPulse 0.8s var(--ease-out-expo) infinite;
        color: var(--accent-warm) !important;
      }
    }
  </style>
</head>

    function beep(freq = 800, dur = 100) {
      if (!soundEnabled) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur / 1000);
      osc.start();
      osc.stop(audioCtx.currentTime + dur / 1000);
    }

    }

      const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);

        item.addEventListener('click', () => {

          currentExercise = i;
          currentSide = 0;
          currentRound = 1;
          showExercise();

        // Update Timer UI
        if (isResting) {
          $('primaryStat').textContent = timeRemaining;
          $('primaryStat').className = 'stat-value'; // White/default for rest
        } else {
          $('primaryStat').textContent = timeRemaining;
          $('primaryStat').className = timeRemaining <= 5 ? 'stat-value orange' : 'stat-value yellow';
        }

        // Beep on last 5 seconds of hold
        if (!isResting && timeRemaining <= 5 && timeRemaining > 0) {
          beep(500, 60);
        }

        if (timeRemaining <= 0) {
          if (isResting) {
            // End of Rest -> Start Hold
            isResting = false;
            currentRep++;
            timeRemaining = ex.hold;

            // Update UI for Hold
            $('primaryStat').parentElement.querySelector('.stat-label').textContent = `REP ${currentRep} / ${ex.reps}`;
            $('primaryStat').textContent = timeRemaining;
            $('primaryStat').className = 'stat-value yellow';
            $('secondaryValue').textContent = 'HOLD';
            $('secondaryValue').className = 'stat-value orange';

            beep(800, 150); // Start work beep
          } else {
            // End of Hold
            if (currentRep >= ex.reps) {
              // Finished all reps
              clearInterval(timerInterval);
              completionBeep();
              advanceStep();
            } else {
              // Start Rest
              isResting = true;
              timeRemaining = ex.rest;

              // Update UI for Rest
              $('primaryStat').textContent = timeRemaining;
              $('primaryStat').className = 'stat-value';
              $('secondaryValue').textContent = 'REST';
              $('secondaryValue').className = 'stat-value'; // White/default

              beep(600, 100); // Rest beep
            }
          }
        }
      }, 1000);
    }

    function advanceStep() {
      const ex = exercises[currentExercise];
      const maxRounds = ex.rounds || 1;

      if (currentSide < ex.sides - 1) {
        currentSide++;
        showExercise();
      } else if (currentRound < maxRounds) {
        currentRound++;
        currentSide = 0;
        showExercise();
      } else {
        goNext();
      }
    }

    function handleDone() {
      const ex = exercises[currentExercise];

      // Clear timer immediately
      if (ex.type === 'timed' || ex.type === 'auto-reps') {
        clearInterval(timerInterval);
      } else {
        completionBeep();
      }

      // Advance immediately - animations happen during showExercise
      advanceStep();
    }

    function goNext() {
      if (timerInterval) clearInterval(timerInterval);

      if (currentExercise < exercises.length - 1) {
        currentExercise++;
        currentSide = 0;
        currentRound = 1;
        showExercise();
      } else {
        showCompletion();
      }
    }

    function goPrev() {
      if (timerInterval) clearInterval(timerInterval);

      const ex = exercises[currentExercise];
      const maxRounds = ex.rounds || 1;

      if (currentSide > 0) {
        currentSide--;
      } else if (currentRound > 1) {
        currentRound--;
        currentSide = ex.sides - 1;
      } else if (currentExercise > 0) {
        currentExercise--;
        const prev = exercises[currentExercise];
        currentRound = prev.rounds || 1;
        currentSide = prev.sides - 1;
      }
      showExercise();
    }

    function showCompletion() {
      if (timerInterval) clearInterval(timerInterval);
      if (sessionTimerInterval) clearInterval(sessionTimerInterval);

      const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
      $('finalTime').textContent = formatTime(elapsed);
      $('finalExercises').textContent = exercises.length;

      exerciseScreen.classList.remove('active');
      completionScreen.classList.add('active');
      completionBeep();
    }

    function startSession() {
      currentExercise = 0;
      currentSide = 0;
      currentRound = 1;
      sessionStartTime = Date.now();

      startScreen.style.display = 'none';
      completionScreen.classList.remove('active');
      exerciseScreen.classList.add('active');

      sessionTimerInterval = setInterval(updateSessionTimer, 1000);
      showExercise();
    }

    // Events
    $('startBtn').addEventListener('click', startSession);
    $('restartBtn').addEventListener('click', startSession);
    $('doneBtn').addEventListener('click', handleDone);
    $('prevBtn').addEventListener('click', goPrev);
    $('backBtn').addEventListener('click', goPrev);
    $('soundToggle').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      $('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
      $('soundToggle').style.opacity = soundEnabled ? '1' : '0.5';
    });

    // Keyboard
    document.addEventListener('keydown', e => {
      if (startScreen.style.display !== 'none' && !exerciseScreen.classList.contains('active')) {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          startSession();
        }
        return;
      }

      if (!exerciseScreen.classList.contains('active')) return;

      switch (e.code) {
        case 'Space':
        case 'Enter':
          e.preventDefault();
          handleDone();
          break;
        case 'ArrowRight':
          e.preventDefault();
          goNext();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          goPrev();
          break;
      }
    });
  </script>
</body>

</html>
